[project]
name = "quantum-appearance-service"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.111.0",
  "openai>=2.0.0,<3.0.0",
  "pydantic>=2.0.0",
  "python-dotenv==1.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
