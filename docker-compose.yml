version: "3.9"

services:
  appearance-ai:
    build:
      context: .
      dockerfile: python/appearance/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./python/appearance/.env
    environment:
      PORT: "8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
